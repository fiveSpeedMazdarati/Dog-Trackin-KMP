name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Test Swift packages
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ DesignSystem, DogTrackinCore ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: |
          SIM_ID=$("$GITHUB_WORKSPACE/scripts/pick-simulator.sh" iOS)
          xcodebuild test \
            -scheme ${{ matrix.package }} \
            -destination "id=$SIM_ID" \
            -skipPackagePluginValidation

  apps:
    name: Build apps (iOS + tvOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # GoogleService-Info.plist is never committed. The app detects its absence at
      # runtime and falls back to an "unconfigured" auth repository, so builds work
      # without it.
      - name: Build iOS app (Simulator)
        run: |
          xcodebuild build \
            -project DogTrackin.xcodeproj \
            -scheme DogTrackin \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build tvOS app (Simulator)
        run: |
          xcodebuild build \
            -project DogTrackin.xcodeproj \
            -scheme DogTrackinTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
