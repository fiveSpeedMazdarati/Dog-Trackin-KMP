name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build & test (Android / JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The google-services plugin fails the build if google-services.json is
      # missing (even for unit tests). The real file is not committed, so write
      # a throwaway placeholder with fake values — enough for the plugin to run.
      # It is never committed and Firebase is not exercised in CI.
      - name: Write placeholder google-services.json
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dogtrackin-ci-placeholder",
              "storage_bucket": "dogtrackin-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.softwareofnote.dogtrackin"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYCIPLACEHOLDERKEYDUMMYCIPLACE0" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests
        run: ./gradlew :composeApp:testAndroidHostTest

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
