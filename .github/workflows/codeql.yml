name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The google-services plugin fails the build if google-services.json is
      # missing. The real file is not committed, so write a throwaway
      # placeholder with fake values, matching ci.yml. Firebase is never
      # exercised here.
      - name: Write placeholder google-services.json
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dogtrackin-ci-placeholder",
              "storage_bucket": "dogtrackin-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.softwareofnote.dogtrackin"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYCIPLACEHOLDERKEYDUMMYCIPLACE0" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Default-setup autobuild guesses a generic `testClasses` task, which
      # doesn't exist now that :composeApp/:androidApp are split (AGP 9+
      # requirement). Build explicitly with the real task, same as ci.yml.
      - name: Build
        run: ./gradlew :androidApp:assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The iosApp target's "Compile Kotlin Framework" build phase shells out
      # to `./gradlew :composeApp:embedAndSignAppleFrameworkForXcode`, so a
      # JDK is required even though this job only analyzes Swift.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      # No shared Xcode scheme is committed (schemes live under the
      # gitignored xcuserdata/ directory), so build the target directly
      # instead of relying on autobuild/-scheme. Simulator SDK + disabled
      # code signing lets this run without a provisioning profile.
      - name: Build
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -target iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
