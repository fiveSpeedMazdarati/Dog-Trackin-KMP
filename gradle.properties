#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 no longer allows com.android.application together with the Kotlin
# Multiplatform plugin in one module (this app's single-module template).
# Opt out of AGP's built-in Kotlin/new DSL to keep the existing setup working.
# Longer term the alternative is splitting composeApp into a KMP library
# module + a separate com.android.application module.
android.builtInKotlin=false
android.newDsl=false