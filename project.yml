# XcodeGen spec — the Xcode project is generated from this file and is NOT committed.
# Run `xcodegen generate` after cloning and whenever this file or the folder layout changes.
name: DogTrackin

options:
  bundleIdPrefix: com.softwareofnote
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Dog Trackin'"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  DesignSystem:
    path: Packages/DesignSystem
  DogTrackinCore:
    path: Packages/DogTrackinCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  DogTrackin:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softwareofnote.dogtrackin
        TARGETED_DEVICE_FAMILY: "1,2"
        # Accent is ink/paper, never lavender: tinted text must stay readable (design-system.md §1.2).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: DesignSystem
      - package: DogTrackinCore
      - package: Firebase
        product: FirebaseAuth
    scheme:
      testTargets: []

  DogTrackinTV:
    type: application
    platform: tvOS
    sources:
      - path: TV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softwareofnote.dogtrackin.tv
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: DesignSystem
    scheme: {}
